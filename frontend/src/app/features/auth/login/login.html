<form class="login" [formGroup]="form" (ngSubmit)="submit()">
  <h1>Sign in</h1>
  <p class="login__subtitle">Use your organization credentials to continue.</p>

  @if (error()) {
    <div class="login__error" role="alert">{{ error() }}</div>
  }

  <mat-form-field appearance="outline" class="full">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="username" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" autocomplete="current-password" />
  </mat-form-field>

  <mat-checkbox formControlName="remember">Remember me</mat-checkbox>

  <button mat-flat-button color="primary" class="full login__submit" type="submit" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      Sign in
    }
  </button>
</form>
