<section class="org-page">
  <app-page-header
    title="Sectors"
    subtitle="Assign sectors from the shared catalogue to this organization."
  />

  <div class="org-page__toolbar">
    <form class="org-page__filters" [formGroup]="filters">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search catalogue</mat-label>
        <input matInput formControlName="search" placeholder="Name or code" />
      </mat-form-field>
    </form>
    <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="save()">
      <mat-icon>save</mat-icon>
      {{ saving() ? 'Saving…' : 'Save assignments' }}
    </button>
  </div>

  @if (loading()) {
    <app-loading-state message="Loading sectors…" />
  } @else if (error()) {
    <app-error-state [message]="error()!" (retry)="reload()" />
  } @else if (!catalog().length) {
    <div class="org-card">
      <app-empty-state
        title="No sectors available"
        message="The shared sector catalogue is empty."
        icon="category"
      />
    </div>
  } @else {
    <div class="org-card org-table-wrap">
      <table mat-table [dataSource]="filtered()" class="org-table">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              [checked]="isSelected(row.id)"
              (change)="toggle(row.id, $event.checked)"
            />
          </td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let row">{{ row.code }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row"><app-status-chip [status]="row.status" /></td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</section>
