<section class="org-page">
  <app-page-header
    title="Geographic Structure"
    subtitle="Define the hierarchical geography used across programmes and facilities."
  />

  <div class="org-page__toolbar">
    <form class="org-page__filters" [formGroup]="filters" (ngSubmit)="reload()">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput formControlName="search" placeholder="Name or code" />
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="">All</mat-option>
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-stroked-button type="submit">Filter</button>
    </form>
    <button mat-flat-button color="primary" type="button" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Add unit
    </button>
  </div>

  @if (loading()) {
    <app-loading-state message="Loading geography…" />
  } @else if (error()) {
    <app-error-state [message]="error()!" (retry)="reload()" />
  } @else if (!items().length) {
    <div class="org-card">
      <app-empty-state
        title="No geographic units"
        message="Start with a root region, then nest districts and wards."
        icon="map"
      />
    </div>
  } @else {
    <div class="org-card org-table-wrap">
      <table mat-table [dataSource]="items()" class="org-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">
            <span [style.padding-left.rem]="row.level * 0.75">{{ row.name }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let row">{{ row.code || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="level">
          <th mat-header-cell *matHeaderCellDef>Level</th>
          <td mat-cell *matCellDef="let row">{{ row.level }}</td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let row">{{ row.type }}</td>
        </ng-container>
        <ng-container matColumnDef="parent">
          <th mat-header-cell *matHeaderCellDef>Parent</th>
          <td mat-cell *matCellDef="let row">{{ parentName(row.parent_id) }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row"><app-status-chip [status]="row.status" /></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <div class="org-actions">
              <button mat-icon-button type="button" matTooltip="Edit" (click)="openForm(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button type="button" matTooltip="Delete" (click)="confirmDelete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</section>
